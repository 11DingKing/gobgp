rubrics:
  - id: 1
    type: f2p
    text: "策略或邻居阶段失败时，调用者收到稳定错误，运行配置继续完整可用且不暴露半应用世代。"
  - id: 2
    type: f2p
    text: "失败重载创建或修改的策略、邻居、动态邻居和认证辅助状态会被撤回或隔离，后续路由计算不读取它们。"
  - id: 3
    type: f2p
    text: "修正配置再次重载会从上一份可运行配置重算，失败尝试遗留的索引、会话和密钥不会阻止收敛。"
  - id: 4
    type: f2p
    text: "成功提交后，策略匹配、对等体状态、动态邻居发现、认证资源和管理查询共同显示同一配置世代。"
  - id: 5
    type: f2p
    text: "外部会话或认证资源在重载中失败时都有明确 owner 和终态，不留下仍运行但不属于有效配置的后台资源。"
  - id: 6
    type: f2p
    text: "连续失败、成功、失败的重载不会让较旧结果覆盖较新世代，进程仍可接受后续更新。"
  - id: 7
    type: p2p
    text: "无错误时，启动配置、增量更新、BGP 会话建立和既有管理查询结果保持兼容。"
  - id: 8
    type: p2p
    text: "与配置对象无关的重载错误继续按原有非致命进程存活语义返回。"
